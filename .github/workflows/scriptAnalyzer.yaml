# packer-windows-jit-v1
# ng-runner-policy: private-jit-only-v1
name: PSScriptAnalyzer


run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      format('action:ci:pool:private:tag:{0}', github.ref_name) || format('action:ci:pool:private') }}
on:
  pull_request:
    types: [labeled]
    branches:
      - master
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"

permissions:
  contents: read # Needed to check out the code
  pull-requests: read # Needed to read pull request details

jobs:
  analyze:
    # Keep external fork code off trusted JIT groups until its isolated route is authorized.
    if: >-
      (
        (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
        contains(github.event.pull_request.labels.*.name, 'action:ci') &&
        contains(github.event.pull_request.labels.*.name, 'pool:private') &&
        github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'workflow_dispatch')
      ) &&
      (
        github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","winget-pkgs","gha-{0}-analyze"]}}', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        run: |
          # Run PSScriptAnalyzer on all PowerShell scripts
          $results = @(Get-ChildItem -Recurse -Filter *.ps1 | Invoke-ScriptAnalyzer)
          $results += @(Get-ChildItem -Recurse -Filter *.psm1 | Invoke-ScriptAnalyzer)
          if ($results) {
            Write-Output $results | Format-List -GroupBy ScriptName
          }

          # If errors are found, exit with a non-zero exit code to fail the job
          if ($results.where({$_.Severity -eq 'Error'})) {
            Write-Host "Found script issues (errors)."
            exit 1  # Exit with a non-zero status to fail the job
          } else {
            Write-Host "No blocking detections."
          }
