# packer-windows-jit-v1
# ng-runner-policy: private-jit-only-v1
name: PSScriptAnalyzer


run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Run PSScriptAnalyzer on the private Windows JIT pool
        required: true
        type: choice
        options: [ci]
      runner_pool:
        description: Select the private ephemeral runner pool
        required: true
        type: choice
        options: [private]

permissions:
  contents: read # Needed to check out the code

jobs:
  analyze:
    # Manual dispatch is restricted to the default branch and the private JIT pool.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'ci' && inputs.runner_pool == 'private' && github.ref == 'refs/heads/master'
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","winget-pkgs","gha-{0}-analyze"]}}', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        run: |
          # Run PSScriptAnalyzer on all PowerShell scripts
          $results = @(Get-ChildItem -Recurse -Filter *.ps1 | Invoke-ScriptAnalyzer)
          $results += @(Get-ChildItem -Recurse -Filter *.psm1 | Invoke-ScriptAnalyzer)
          if ($results) {
            Write-Output $results | Format-List -GroupBy ScriptName
          }

          # If errors are found, exit with a non-zero exit code to fail the job
          if ($results.where({$_.Severity -eq 'Error'})) {
            Write-Host "Found script issues (errors)."
            exit 1  # Exit with a non-zero status to fail the job
          } else {
            Write-Host "No blocking detections."
          }
