# packer-windows-jit-v1
# ng-runner-policy: private-jit-only-v1
name: Pester Tests


run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Run the Pester tests on the private Windows JIT pool
        required: true
        type: choice
        options: [test]
      runner_pool:
        description: Select the private ephemeral runner pool
        required: true
        type: choice
        options: [private]

permissions:
  contents: read # Needed to check out the code

jobs:
  test:
    # Manual dispatch is restricted to the default branch and the private JIT pool.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'test' && inputs.runner_pool == 'private' && github.ref == 'refs/heads/master'
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","winget-pkgs","gha-{0}-test"]}}', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Install Pester
        run: |
          # Pester 5.x is already included in Windows runners, but ensure latest version
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0.0
      - name: Run Pester Tests
        run: |
          # Find and run all Pester test files
          $testFiles = Get-ChildItem -Recurse -Filter *.Tests.ps1
          if ($testFiles) {
            Write-Host "Found $($testFiles.Count) test file(s)"
            foreach ($testFile in $testFiles) {
              Write-Host "Running tests in: $($testFile.FullName)"
            }

            # Run all tests
            $config = New-PesterConfiguration
            $config.Run.Path = $testFiles.FullName
            $config.Run.Exit = $true
            $config.Output.Verbosity = 'Detailed'
            $config.TestResult.Enabled = $true

            Invoke-Pester -Configuration $config
          } else {
            Write-Host "No Pester test files found."
          }
