# ng-runner-policy: private-jit-only-v1
name: Pester Tests

on:
  pull_request:
    types: [labeled]
    branches:
      - master
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
  push:
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"

    branches-ignore:
      - "master"
    tags:
      - "*"
permissions:
  contents: read # Needed to check out the code
  pull-requests: read # Needed to read pull request details

jobs:
  test:
    # Keep external fork code off trusted JIT groups until its isolated route is authorized.
    if: >-
      (
        (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
        contains(github.event.pull_request.labels.*.name, 'action:ci') &&
        contains(github.event.pull_request.labels.*.name, 'pool:private') &&
        github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'workflow_dispatch')
      ) &&
      (
        github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","packer-windows","ng-shared-main-winget-pkgs","ng-main-run-{0}","gha-{0}-test"]}}', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Install Pester
        run: |
          # Pester 5.x is already included in Windows runners, but ensure latest version
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0.0
      - name: Run Pester Tests
        run: |
          # Find and run all Pester test files
          $testFiles = Get-ChildItem -Recurse -Filter *.Tests.ps1
          if ($testFiles) {
            Write-Host "Found $($testFiles.Count) test file(s)"
            foreach ($testFile in $testFiles) {
              Write-Host "Running tests in: $($testFile.FullName)"
            }

            # Run all tests
            $config = New-PesterConfiguration
            $config.Run.Path = $testFiles.FullName
            $config.Run.Exit = $true
            $config.Output.Verbosity = 'Detailed'
            $config.TestResult.Enabled = $true

            Invoke-Pester -Configuration $config
          } else {
            Write-Host "No Pester test files found."
          }
